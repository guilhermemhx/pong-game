<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cesta de Basquete</title>
    <style>
      :root {
        --bg1: #08111d;
        --bg2: #132d3d;
        --court: #1b8f5a;
        --court-line: rgba(255, 255, 255, 0.18);
        --orange: #ff9e43;
        --orange-dark: #ef6f00;
        --blue: #2f80ed;
        --red: #ff4d6d;
        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
        user-select: none;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--bg1), var(--bg2));
        color: var(--white);
        font-family: Arial, Helvetica, sans-serif;
      }

      .game-wrap {
        width: min(920px, 92vw);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .score {
        font-size: clamp(1.3rem, 2vw, 2rem);
        font-weight: bold;
        letter-spacing: 1px;
      }

      .controls {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .upload-btn,
      .reset-btn {
        border: none;
        border-radius: 10px;
        padding: 10px 16px;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.15s ease;
      }

      .upload-btn {
        background: linear-gradient(135deg, var(--blue), #5aa4ff);
        color: white;
      }

      .reset-btn {
        background: linear-gradient(135deg, var(--orange), var(--orange-dark));
        color: white;
      }

      .upload-btn:hover,
      .reset-btn:hover {
        transform: translateY(-2px);
        filter: brightness(1.08);
      }

      #fileInput {
        display: none;
      }

      .arena {
        position: relative;
        width: 100%;
        height: 560px;
        overflow: hidden;
        border-radius: 18px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        background: linear-gradient(180deg, #66c5ff 0%, #a9e3ff 26%, var(--court) 27%, #1f7a49 100%);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.28);
      }

      .court-lines {
        position: absolute;
        inset: 0;
      }

      .line {
        position: absolute;
        border: 2px solid var(--court-line);
      }

      .mid-circle {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        left: 50%;
        top: 64%;
        transform: translate(-50%, -50%);
      }

      .three-line {
        width: 180px;
        height: 220px;
        left: 12%;
        top: 62%;
        border-radius: 50% 50% 0 0;
        border-bottom: 0;
      }

      .three-line.right {
        left: auto;
        right: 12%;
      }

      .hoop {
        position: absolute;
        right: 100px;
        top: 120px;
        width: 180px;
        height: 150px;
      }

      .backboard {
        position: absolute;
        right: 35px;
        top: 10px;
        width: 110px;
        height: 72px;
        background: rgba(255, 255, 255, 0.9);
        border: 4px solid rgba(20, 40, 60, 0.5);
        border-radius: 8px;
      }

      .rim {
        position: absolute;
        right: 24px;
        top: 85px;
        width: 120px;
        height: 18px;
        border: 5px solid #ffb703;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.2);
      }

      .rim::before {
        content: "";
        position: absolute;
        inset: 10px 18px auto 18px;
        height: 3px;
        background: rgba(255, 255, 255, 0.8);
      }

      .net {
        position: absolute;
        right: 53px;
        top: 100px;
        width: 62px;
        height: 52px;
        background-image: linear-gradient(to right, rgba(255,255,255,0.2) 0 10%, transparent 10% 20%, rgba(255,255,255,0.2) 20% 30%, transparent 30% 40%, rgba(255,255,255,0.2) 40% 50%, transparent 50% 60%, rgba(255,255,255,0.2) 60% 70%, transparent 70% 80%, rgba(255,255,255,0.2) 80% 90%, transparent 90% 100%);
        border-radius: 0 0 8px 8px;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 0);
        opacity: 0.9;
      }

      .drop-area {
        position: absolute;
        left: 22px;
        bottom: 20px;
        width: 230px;
        min-height: 120px;
        padding: 12px;
        border: 2px dashed rgba(255, 255, 255, 0.5);
        border-radius: 14px;
        background: rgba(0, 0, 0, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: rgba(255, 255, 255, 0.8);
        font-weight: bold;
      }

      .ball {
        position: absolute;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 4px solid rgba(255,255,255,0.9);
        box-shadow: inset -10px -8px 18px rgba(0,0,0,0.25), 0 10px 16px rgba(0,0,0,0.22);
        background-size: cover;
        background-position: center;
        cursor: grab;
        z-index: 10;
        transform: translate(-50%, -50%);
        transition: box-shadow 0.2s ease;
      }

      .ball.dragging {
        cursor: grabbing;
        box-shadow: inset -10px -8px 18px rgba(0,0,0,0.25), 0 18px 24px rgba(0,0,0,0.35);
      }

      .ball.empty {
        background: linear-gradient(135deg, #ffb703, #fb8500);
      }

      .ball.empty::before {
        content: "🏀";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 1.8rem;
      }

      .message {
        position: absolute;
        left: 50%;
        top: 26px;
        transform: translateX(-50%);
        background: rgba(8, 17, 29, 0.7);
        border: 1px solid rgba(255,255,255,0.2);
        padding: 8px 16px;
        border-radius: 999px;
        font-weight: bold;
        color: white;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .message.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="game-wrap">
      <div class="topbar">
        <div class="score">Pontos: <span id="score">0</span></div>

        <div class="controls">
          <label for="fileInput" class="upload-btn">Escolher arquivo</label>
          <input id="fileInput" type="file" accept="image/*,.pdf,.doc,.docx,.txt" />
          <button type="button" class="reset-btn" id="resetBtn">Reiniciar</button>
        </div>
      </div>

      <div class="arena" id="arena">
        <div class="court-lines">
          <div class="line mid-circle"></div>
          <div class="line three-line"></div>
          <div class="line three-line right"></div>
        </div>

        <div class="hoop" aria-label="Cesta">
          <div class="backboard"></div>
          <div class="rim"></div>
          <div class="net"></div>
        </div>

        <div class="drop-area" id="dropArea">
          Arraste um arquivo aqui<br />ou escolha um arquivo
        </div>

        <div class="message" id="message">+</div>
        <div class="ball empty" id="ball"></div>
      </div>
    </div>

    <script>
      const arena = document.getElementById("arena");
      const ball = document.getElementById("ball");
      const scoreEl = document.getElementById("score");
      const fileInput = document.getElementById("fileInput");
      const dropArea = document.getElementById("dropArea");
      const messageEl = document.getElementById("message");
      const resetBtn = document.getElementById("resetBtn");

      const state = {
        score: 0,
        isDragging: false,
        hasFile: false,
        ballX: 180,
        ballY: 420,
        vx: 0,
        vy: 0,
        gravity: 0.42,
        friction: 0.99,
        launched: false,
        shotPower: 0,
        lastPointer: { x: 0, y: 0 },
        fileText: ""
      };

      function setBallPosition(x, y) {
        state.ballX = x;
        state.ballY = y;
        ball.style.left = x + "px";
        ball.style.top = y + "px";
      }

      function resetBallPosition() {
        setBallPosition(150, 445);
        state.vx = 0;
        state.vy = 0;
        state.launched = false;
        state.isDragging = false;
        ball.classList.remove("dragging");
      }

      function updateBallVisual() {
        if (!state.hasFile) {
          ball.style.backgroundImage = "";
          ball.classList.add("empty");
          return;
        }

        ball.classList.remove("empty");
      }

      function showMessage(text) {
        messageEl.textContent = text;
        messageEl.classList.add("show");
        clearTimeout(showMessage.timeoutId);
        showMessage.timeoutId = setTimeout(() => {
          messageEl.classList.remove("show");
        }, 700);
      }

      function scorePoint() {
        state.score += 1;
        scoreEl.textContent = state.score;
        showMessage("Cesta!");
        setTimeout(() => {
          resetBallPosition();
        }, 350);
      }

      function applyFile(file) {
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const result = event.target.result;
          state.hasFile = true;
          state.fileText = file.name;
          ball.style.backgroundImage = `url(${result})`;
          ball.title = file.name;
          updateBallVisual();
          resetBallPosition();
        };
        reader.readAsDataURL(file);
      }

      function handleFileSelection(event) {
        const file = event.target.files[0];
        applyFile(file);
      }

      function getArenaBounds() {
        const rect = arena.getBoundingClientRect();
        return { width: rect.width, height: rect.height };
      }

      function isInBasket() {
        const basket = {
          x: arena.offsetWidth - 200,
          y: 110,
          width: 120,
          height: 110
        };

        const radius = 32;
        const centerX = state.ballX;
        const centerY = state.ballY;

        return (
          centerX + radius > basket.x &&
          centerX - radius < basket.x + basket.width &&
          centerY + radius > basket.y &&
          centerY - radius < basket.y + basket.height &&
          state.vy > 0
        );
      }

      function updatePhysics() {
        const bounds = getArenaBounds();

        if (!state.launched) return;

        state.vy += state.gravity;
        state.ballX += state.vx;
        state.ballY += state.vy;

        if (state.ballY + 32 >= bounds.height) {
          state.ballY = bounds.height - 32;
          state.vy *= -0.45;
          state.vx *= 0.88;
          if (Math.abs(state.vy) < 2) {
            state.vy = 0;
            state.vx = 0;
            state.launched = false;
            showMessage("Errou!");
          }
        }

        if (state.ballX - 32 <= 0) {
          state.ballX = 32;
          state.vx *= -0.72;
        }

        if (state.ballX + 32 >= bounds.width) {
          state.ballX = bounds.width - 32;
          state.vx *= -0.72;
        }

        if (state.ballY - 32 <= 0) {
          state.ballY = 32;
          state.vy *= -0.5;
        }

        if (isInBasket()) {
          scorePoint();
          state.launched = false;
          state.vx = 0;
          state.vy = 0;
        }

        setBallPosition(state.ballX, state.ballY);
      }

      function attachDragEvents() {
        ball.addEventListener("pointerdown", (event) => {
          if (!state.hasFile || state.launched) return;

          state.isDragging = true;
          ball.classList.add("dragging");
          const rect = ball.getBoundingClientRect();
          state.lastPointer.x = event.clientX;
          state.lastPointer.y = event.clientY;
          ball.setPointerCapture(event.pointerId);

          const offsetX = event.clientX - rect.left;
          const offsetY = event.clientY - rect.top;
          ball.dataset.offsetX = offsetX;
          ball.dataset.offsetY = offsetY;
        });

        ball.addEventListener("pointermove", (event) => {
          if (!state.isDragging || !state.hasFile) return;

          const rect = arena.getBoundingClientRect();
          const x = event.clientX - rect.left;
          const y = event.clientY - rect.top;

          const targetX = Math.max(32, Math.min(rect.width - 32, x));
          const targetY = Math.max(32, Math.min(rect.height - 32, y));
          setBallPosition(targetX, targetY);

          state.vx = (event.clientX - state.lastPointer.x) * 0.22;
          state.vy = (event.clientY - state.lastPointer.y) * 0.22;
          state.lastPointer.x = event.clientX;
          state.lastPointer.y = event.clientY;
        });

        ball.addEventListener("pointerup", (event) => {
          if (!state.isDragging) return;

          state.isDragging = false;
          ball.classList.remove("dragging");

          const dx = (event.clientX - state.lastPointer.x) * 0.45;
          const dy = (event.clientY - state.lastPointer.y) * 0.45;

          state.vx = dx * 0.9;
          state.vy = dy * 0.9;

          if (Math.abs(state.vx) > 0.5 || Math.abs(state.vy) > 0.5) {
            state.launched = true;
          }

          state.lastPointer.x = 0;
          state.lastPointer.y = 0;
        });

        ball.addEventListener("pointerleave", () => {
          if (state.isDragging) {
            state.isDragging = false;
            ball.classList.remove("dragging");
          }
        });
      }

      function handleDrop(event) {
        event.preventDefault();
        const file = event.dataTransfer.files[0];
        applyFile(file);
      }

      ["dragenter", "dragover"].forEach((type) => {
        dropArea.addEventListener(type, (event) => {
          event.preventDefault();
          dropArea.style.borderColor = "rgba(255,255,255,0.9)";
          dropArea.style.background = "rgba(255,255,255,0.08)";
        });
      });

      ["dragleave", "drop"].forEach((type) => {
        dropArea.addEventListener(type, (event) => {
          event.preventDefault();
          dropArea.style.borderColor = "rgba(255,255,255,0.5)";
          dropArea.style.background = "rgba(0,0,0,0.12)";
        });
      });

      dropArea.addEventListener("drop", handleDrop);
      fileInput.addEventListener("change", handleFileSelection);
      resetBtn.addEventListener("click", () => {
        state.score = 0;
        scoreEl.textContent = 0;
        resetBallPosition();
      });

      function loop() {
        updatePhysics();
        requestAnimationFrame(loop);
      }

      resetBallPosition();
      updateBallVisual();
      attachDragEvents();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
