<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pong</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #090d16;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
      }

      .game-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .scoreboard {
        width: 800px;
        display: flex;
        justify-content: space-between;
        font-size: 1.5rem;
        font-weight: bold;
        letter-spacing: 1px;
      }

      canvas {
        display: block;
        width: 800px;
        height: 500px;
        background: linear-gradient(180deg, #0e1424, #111827);
        border: 3px solid #fff;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.12);
      }
    </style>
  </head>
  <body>
    <div class="game-box">
      <div class="scoreboard">
        <span>Jogador: <strong id="playerScore">0</strong></span>
        <span>Computador: <strong id="computerScore">0</strong></span>
      </div>

      <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      const playerScoreEl = document.getElementById("playerScore");
      const computerScoreEl = document.getElementById("computerScore");

      const paddleWidth = 12;
      const paddleHeight = 110;
      const paddleOffset = 25;

      const leftPaddle = {
        x: paddleOffset,
        y: canvas.height / 2 - paddleHeight / 2,
        width: paddleWidth,
        height: paddleHeight,
        speed: 8
      };

      const rightPaddle = {
        x: canvas.width - paddleOffset - paddleWidth,
        y: canvas.height / 2 - paddleHeight / 2,
        width: paddleWidth,
        height: paddleHeight,
        speed: 5.2
      };

      const ball = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 8,
        speed: 6,
        vx: 6,
        vy: 4
      };

      const keys = {
        ArrowUp: false,
        ArrowDown: false
      };

      let playerScore = 0;
      let computerScore = 0;

      function resetBall(direction = 1) {
        ball.x = canvas.width / 2;
        ball.y = canvas.height / 2;

        const angle = (Math.random() * (Math.PI / 2)) - (Math.PI / 4);
        const speed = ball.speed + Math.min(playerScore + computerScore, 8) * 0.35;

        ball.vx = Math.cos(angle) * speed * direction;
        ball.vy = Math.sin(angle) * speed;
      }

      function updatePlayerPaddle() {
        if (keys.ArrowUp) leftPaddle.y -= leftPaddle.speed;
        if (keys.ArrowDown) leftPaddle.y += leftPaddle.speed;

        leftPaddle.y = Math.max(0, Math.min(canvas.height - leftPaddle.height, leftPaddle.y));
      }

      canvas.addEventListener("mousemove", (event) => {
        const rect = canvas.getBoundingClientRect();
        const mouseY = event.clientY - rect.top;

        leftPaddle.y = mouseY - leftPaddle.height / 2;
        leftPaddle.y = Math.max(0, Math.min(canvas.height - leftPaddle.height, leftPaddle.y));
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowUp" || event.key === "ArrowDown") {
          keys[event.key] = true;
          event.preventDefault();
        }
      });

      document.addEventListener("keyup", (event) => {
        if (event.key === "ArrowUp" || event.key === "ArrowDown") {
          keys[event.key] = false;
        }
      });

      function updateComputerPaddle() {
        const targetY = ball.y - (rightPaddle.y + rightPaddle.height / 2);
        rightPaddle.y += targetY * 0.08;
        rightPaddle.y = Math.max(0, Math.min(canvas.height - rightPaddle.height, rightPaddle.y));
      }

      function handleWallCollision() {
        if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= canvas.height) {
          ball.vy *= -1;
          ball.y = Math.max(ball.radius, Math.min(canvas.height - ball.radius, ball.y));
        }
      }

      function handlePaddleCollision() {
        if (
          ball.x - ball.radius <= leftPaddle.x + leftPaddle.width &&
          ball.y >= leftPaddle.y &&
          ball.y <= leftPaddle.y + leftPaddle.height &&
          ball.vx < 0
        ) {
          ball.x = leftPaddle.x + leftPaddle.width + ball.radius;

          const relativeIntersectY =
            (ball.y - (leftPaddle.y + leftPaddle.height / 2)) / (leftPaddle.height / 2);

          const bounceAngle = relativeIntersectY * 1.2;
          const speed = Math.hypot(ball.vx, ball.vy) * 1.04;

          ball.vx = Math.cos(bounceAngle) * speed;
          ball.vy = Math.sin(bounceAngle) * speed;
        }

        if (
          ball.x + ball.radius >= rightPaddle.x &&
          ball.y >= rightPaddle.y &&
          ball.y <= rightPaddle.y + rightPaddle.height &&
          ball.vx > 0
        ) {
          ball.x = rightPaddle.x - ball.radius;

          const relativeIntersectY =
            (ball.y - (rightPaddle.y + rightPaddle.height / 2)) / (rightPaddle.height / 2);

          const bounceAngle = relativeIntersectY * 1.2;
          const speed = Math.hypot(ball.vx, ball.vy) * 1.04;

          ball.vx = -Math.cos(bounceAngle) * speed;
          ball.vy = Math.sin(bounceAngle) * speed;
        }
      }

      function checkScoring() {
        if (ball.x - ball.radius < 0) {
          computerScore++;
          computerScoreEl.textContent = computerScore;
          resetBall(1);
        }

        if (ball.x + ball.radius > canvas.width) {
          playerScore++;
          playerScoreEl.textContent = playerScore;
          resetBall(-1);
        }
      }

      function update() {
        updatePlayerPaddle();
        updateComputerPaddle();

        ball.x += ball.vx;
        ball.y += ball.vy;

        handleWallCollision();
        handlePaddleCollision();
        checkScoring();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#0e1424";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "rgba(255,255,255,0.35)";
        ctx.setLineDash([12, 12]);
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 0);
        ctx.lineTo(canvas.width / 2, canvas.height);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(leftPaddle.x, leftPaddle.y, leftPaddle.width, leftPaddle.height);
        ctx.fillRect(rightPaddle.x, rightPaddle.y, rightPaddle.width, rightPaddle.height);

        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#ffd166";
        ctx.fill();
      }

      function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
      }

      resetBall(1);
      requestAnimationFrame(gameLoop);
    </script>
  </body>
</html>
